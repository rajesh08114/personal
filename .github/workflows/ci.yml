name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports: ['27017:27017']
    env:
      # Runs the API test suite against MongoDB as well as file storage.
      MONGODB_TEST_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        storage: [files, mongodb]
    services:
      mongodb:
        image: mongo:8
        ports: ['27017:27017']
    env:
      MONGODB_URI: ${{ matrix.storage == 'mongodb' && 'mongodb://localhost:27017' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ matrix.storage }}
          path: playwright-report
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t birthday-studio .
      - name: Smoke test the image
        run: |
          docker run -d --name app -p 8787:8787 -e PUBLIC_ORIGIN=http://localhost:8787 birthday-studio
          for i in $(seq 1 20); do curl -fsS http://localhost:8787/api/health && break; sleep 1; done
          curl -fsS http://localhost:8787/templates | grep -q 'Birthday Studio'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/templates/no-such-template)" = 404
          docker logs app
