<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Birthday Studio</title>
    <meta name="description" content="Make a personal, interactive birthday website in minutes: your photos and words, told as a newspaper, a film, a letter or a scrapbook." />
    <meta name="theme-color" content="#f4efe6" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Birthday Studio" />
    <meta property="og:title" content="Birthday Studio" />
    <meta property="og:description" content="Make a personal, interactive birthday website in minutes." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Studio fonts: preloaded here, applied from main.tsx so they never block first paint (and no inline script is needed, which keeps the CSP strict). Templates load their own fonts on demand. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Manrope:wght@400;500;600;700&display=swap"
    />
    <style>
      /* Shown until the app's first render replaces it. */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; font: 500 15px/1.4 system-ui, sans-serif; color: #5b5348; }
    </style>
  </head>
  <body>
    <div id="root"><div id="boot">Loading…</div></div>
    <noscript>
      <p style="padding: 2rem; font-family: system-ui, sans-serif">Birthday Studio needs JavaScript to show the birthday experience.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
